<!doctype html>
<html lang="fr" data-theme="clair">
  <head>
    <meta charset="UTF-8" />

    <!-- politique de sécurité -->
    <!-- Remplacé au build par scripts/prerendu.mjs, qui calcule l'empreinte des
         scripts inline réellement produits. En développement, Vite injecte ses
         propres scripts : la politique ne s'applique donc qu'au site publié. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- %BASE_URL% est substitué par Vite : la base ne s'écrit qu'une fois,
         dans vite.config.ts. Un chemin relatif serait faux sur les pages de
         cas, qui vivent deux niveaux plus bas. -->
    <link rel="icon" type="image/svg+xml" href="%BASE_URL%favicon.svg" />
    <!-- Couleur de la barre d'adresse mobile ; réglée par le script ci-dessous
         puis tenue à jour par src/client.ts à chaque bascule de thème. -->
    <meta name="theme-color" content="#fbfaf8" />

    <meta name="author" content="Anthony Jose" />
    <!-- Le site n'a pas vocation à être trouvé par un moteur : il se partage par
         lien, dans une candidature. Les balises og: restent en place, car elles
         servent l'aperçu affiché par LinkedIn et les messageries, qui lisent la
         page directement et ne consultent aucun index. -->
    <meta name="robots" content="noindex, nofollow" />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />

    <!-- métadonnées de langue -->
    <!-- Ce bloc est réécrit pour chaque langue par scripts/prerendu.mjs, qui en
         tire le titre, la description, l'URL canonique et les liens hreflang.
         Les valeurs françaises ci-dessous servent telles quelles en dev. -->
    <title>Anthony Jose — Systèmes, réseaux &amp; sécurité</title>
    <meta
      name="description"
      content="Étudiant en Master Informatique à Lyon, parcours SRS, en recherche d'alternance pour la rentrée 2027. Administration système et réseau, supervision, automatisation, cybersécurité — et le développement des outils qui vont avec."
    />
    <link rel="canonical" href="https://joseanthony-dev.github.io/portfolio/" />
    <meta property="og:title" content="Anthony Jose — Systèmes, réseaux &amp; sécurité" />
    <meta
      property="og:description"
      content="Administration système et réseau, supervision, automatisation et cybersécurité — et du développement. Projets, parcours et CV."
    />
    <meta property="og:url" content="https://joseanthony-dev.github.io/portfolio/" />
    <meta property="og:image" content="https://joseanthony-dev.github.io/portfolio/apercu.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Anthony Jose — Systèmes, réseaux &amp; sécurité" />
    <meta property="og:locale" content="fr_FR" />
    <meta property="og:locale:alternate" content="en_US" />
    <!-- fin métadonnées de langue -->

    <!-- Évite le clignotement blanc au chargement en thème sombre -->
    <script>
      (function () {
        var t = null
        // Seule la lecture du stockage peut lever : le repli sur la préférence
        // système doit rester en dehors du try, sinon un navigateur qui bloque
        // les données de site resterait en thème clair. App.tsx reprend cette
        // décision telle quelle, elle doit donc être juste dans tous les cas.
        try {
          t = localStorage.getItem('theme')
        } catch (e) {
          /* stockage inaccessible : on s'en remet à la préférence système */
        }
        if (t !== 'clair' && t !== 'sombre') {
          t = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'sombre' : 'clair'
        }
        document.documentElement.dataset.theme = t
        document
          .querySelector('meta[name="theme-color"]')
          .setAttribute('content', t === 'sombre' ? '#0d1013' : '#fbfaf8')
      })()
    </script>

    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Person",
        "name": "Anthony Jose",
        "jobTitle": "Administrateur systèmes et réseaux",
        "email": "mailto:anthony.jose@outlook.fr",
        "address": { "@type": "PostalAddress", "addressLocality": "Montagny", "addressRegion": "Rhône", "addressCountry": "FR" },
        "alumniOf": { "@type": "CollegeOrUniversity", "name": "Université Claude Bernard Lyon 1" },
        "sameAs": [
          "https://github.com/joseanthony-dev",
          "https://www.linkedin.com/in/joseanthony-zacharias"
        ],
        "knowsAbout": ["Linux", "Administration système et réseau", "Supervision", "Centreon", "Cybersécurité", "Automatisation", "TypeScript", "C++"]
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/client.ts"></script>
  </body>
</html>
