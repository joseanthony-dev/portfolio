    <!-- Évite le clignotement blanc au chargement en thème sombre -->
    <script>
      (function () {
        try {
          var t = localStorage.getItem('theme')
          if (t !== 'clair' && t !== 'sombre') {
            t = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'sombre' : 'clair'
          }
          document.documentElement.dataset.theme = t
        } catch (e) {
          /* pas de préférence accessible : on garde le thème clair */
        }
      })()
    </script>
