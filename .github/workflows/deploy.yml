# Construit le site et le publie sur GitHub Pages à chaque push sur main.
name: Déploiement GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Un seul déploiement à la fois ; on laisse finir celui en cours.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # Chaque action est épinglée par empreinte de commit, jamais par tag : un
      # tag est mutable, et qui le déplace exécute son code ici. Le commentaire
      # dit la version ; Dependabot tient les deux à jour ensemble.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Le lint tourne aussi ici : les commits arrivent souvent directement sur
      # main, sans passer par une pull request et donc par ci.yml.
      - run: npm run lint
      - run: npm run build
      # Cette action et deploy-pages plus bas s'accordent sur le format de
      # l'artefact : elles montent de majeure ensemble, ou pas du tout.
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3.0.1
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
