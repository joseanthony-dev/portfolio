# Vérifie une branche avant qu'elle n'atteigne main. Le déploiement, lui, vit
# dans deploy.yml et ne tourne que sur main.
name: Vérification

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# Une nouvelle poussée sur la même branche annule la vérification en cours :
# seul son dernier état nous intéresse.
concurrency:
  group: verification-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verifier:
    name: Lint et build
    runs-on: ubuntu-latest
    steps:
      # Chaque action est épinglée par empreinte de commit, jamais par tag : un
      # tag est mutable, et qui le déplace exécute son code ici. Le commentaire
      # dit la version ; Dependabot tient les deux à jour ensemble.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      # `npm run build` enchaîne tsc -b — qui fait échouer la compilation si une
      # traduction manque un champ —, le build client, le build SSR, puis le
      # pré-rendu, qui refuse de produire une page vide.
      - run: npm run build
